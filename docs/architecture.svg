<svg viewBox="0 0 940 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .ci { fill: #eef2ff; stroke: #4338ca; }
    .edge-azure { fill: #e5f2ff; stroke: #0078d4; }
    .edge-aws { fill: #fff3e0; stroke: #d97a00; }
    .edge-gcp { fill: #e8f0fe; stroke: #1a73e8; }
    .secret { fill: #fdf2f8; stroke: #be185d; stroke-dasharray: 3,2; }
    .label { fill: #1f2328; font-size: 13px; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .cloud-title { fill: #1f2328; font-size: 14px; font-weight: 700; }
    .small { fill: #57606a; font-size: 11px; }
    .arrow { stroke: #57606a; stroke-width: 1.4; fill: none; marker-end: url(#arrowhead); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .ci { fill: #1a1f3d; stroke: #818cf8; }
      .edge-azure { fill: #0a2a44; stroke: #4db8ff; }
      .edge-aws { fill: #3d2a00; stroke: #ffb84d; }
      .edge-gcp { fill: #0d2a52; stroke: #669df6; }
      .secret { fill: #3d1530; stroke: #f472b6; }
      .label, .title, .cloud-title { fill: #e6edf3; }
      .small { fill: #9198a1; }
      .arrow { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="660"/>

  <!-- CI/CD row -->
  <text x="20" y="24" class="title">GitHub Actions (OIDC — no long-lived cloud credentials)</text>
  <rect class="box ci" x="20" y="36" width="430" height="46" rx="6"/>
  <text x="235" y="55" text-anchor="middle" class="label">image.yml</text>
  <text x="235" y="72" text-anchor="middle" class="small">build + Trivy scan (PR) → push to GHCR (main)</text>

  <rect class="box ci" x="470" y="36" width="450" height="46" rx="6"/>
  <text x="695" y="55" text-anchor="middle" class="label">terraform.yml</text>
  <text x="695" y="72" text-anchor="middle" class="small">plan + comment (PR) → apply (push to main)</text>

  <line class="arrow" x1="470" y1="59" x2="450" y2="59"/>

  <!-- GHCR -->
  <rect class="box" x="380" y="96" width="180" height="34" rx="6"/>
  <text x="470" y="118" text-anchor="middle" class="label">ghcr.io/quest-demo (public)</text>
  <line class="arrow" x1="235" y1="82" x2="235" y2="113" />
  <line class="arrow" x1="235" y1="113" x2="380" y2="113" />
  <line class="arrow" x1="470" y1="130" x2="150" y2="176" />
  <line class="arrow" x1="470" y1="130" x2="470" y2="176" />
  <line class="arrow" x1="470" y1="130" x2="790" y2="176" />

  <!-- column headers -->
  <text x="150" y="168" text-anchor="middle" class="cloud-title">Azure</text>
  <text x="470" y="168" text-anchor="middle" class="cloud-title">AWS</text>
  <text x="790" y="168" text-anchor="middle" class="cloud-title">GCP</text>

  <!-- Azure column (x center 150, width 260 -> x=20..280) -->
  <rect class="box" x="20" y="182" width="260" height="30" rx="6"/>
  <text x="150" y="202" text-anchor="middle" class="label">Internet</text>
  <line class="arrow" x1="150" y1="212" x2="150" y2="228"/>

  <rect class="box edge-azure" x="20" y="228" width="260" height="38" rx="6"/>
  <text x="150" y="248" text-anchor="middle" class="label">Standard Load Balancer</text>
  <text x="150" y="261" text-anchor="middle" class="small">:80 ACME challenge · :443 TLS</text>
  <line class="arrow" x1="150" y1="266" x2="150" y2="282"/>

  <rect class="box" x="20" y="282" width="260" height="30" rx="6"/>
  <text x="150" y="302" text-anchor="middle" class="label">VMSS instance (1x)</text>
  <line class="arrow" x1="150" y1="312" x2="150" y2="328"/>

  <rect class="box edge-azure" x="20" y="328" width="260" height="38" rx="6"/>
  <text x="150" y="348" text-anchor="middle" class="label">Caddy — Let's Encrypt TLS</text>
  <text x="150" y="361" text-anchor="middle" class="small">reverse_proxy → app container :3000</text>
  <line class="arrow" x1="150" y1="366" x2="150" y2="382"/>

  <rect class="box" x="20" y="382" width="260" height="30" rx="6"/>
  <text x="150" y="402" text-anchor="middle" class="label">Log Analytics (via DCR)</text>

  <rect class="box secret" x="20" y="424" width="260" height="30" rx="6"/>
  <text x="150" y="444" text-anchor="middle" class="label">SECRET_WORD baked into cloud-init</text>
  <line class="arrow" x1="150" y1="424" x2="150" y2="366"/>

  <!-- AWS column (x center 470, x=340..600) -->
  <rect class="box" x="340" y="182" width="260" height="30" rx="6"/>
  <text x="470" y="202" text-anchor="middle" class="label">Internet</text>
  <line class="arrow" x1="470" y1="212" x2="470" y2="228"/>

  <rect class="box edge-aws" x="340" y="228" width="260" height="38" rx="6"/>
  <text x="470" y="248" text-anchor="middle" class="label">CloudFront</text>
  <text x="470" y="261" text-anchor="middle" class="small">managed TLS · *.cloudfront.net</text>
  <line class="arrow" x1="470" y1="266" x2="470" y2="282"/>

  <rect class="box" x="340" y="282" width="260" height="30" rx="6"/>
  <text x="470" y="302" text-anchor="middle" class="label">ALB :80</text>
  <line class="arrow" x1="470" y1="312" x2="470" y2="328"/>

  <rect class="box" x="340" y="328" width="260" height="38" rx="6"/>
  <text x="470" y="348" text-anchor="middle" class="label">ECS Fargate</text>
  <text x="470" y="361" text-anchor="middle" class="small">app container :3000</text>
  <line class="arrow" x1="470" y1="366" x2="470" y2="382"/>

  <rect class="box" x="340" y="382" width="260" height="30" rx="6"/>
  <text x="470" y="402" text-anchor="middle" class="label">CloudWatch Logs</text>

  <rect class="box secret" x="340" y="424" width="260" height="30" rx="6"/>
  <text x="470" y="444" text-anchor="middle" class="label">Secrets Manager → task secrets[]</text>
  <line class="arrow" x1="470" y1="424" x2="470" y2="366"/>

  <!-- GCP column (x center 790, x=660..920) -->
  <rect class="box" x="660" y="182" width="260" height="30" rx="6"/>
  <text x="790" y="202" text-anchor="middle" class="label">Internet</text>
  <line class="arrow" x1="790" y1="212" x2="790" y2="228"/>

  <rect class="box edge-gcp" x="660" y="228" width="260" height="38" rx="6"/>
  <text x="790" y="248" text-anchor="middle" class="label">External HTTPS Load Balancer</text>
  <text x="790" y="261" text-anchor="middle" class="small">Google-managed TLS · sslip.io host</text>
  <line class="arrow" x1="790" y1="266" x2="790" y2="282"/>

  <rect class="box" x="660" y="282" width="260" height="30" rx="6"/>
  <text x="790" y="302" text-anchor="middle" class="label">Serverless NEG</text>
  <line class="arrow" x1="790" y1="312" x2="790" y2="328"/>

  <rect class="box" x="660" y="328" width="260" height="38" rx="6"/>
  <text x="790" y="348" text-anchor="middle" class="label">Cloud Run</text>
  <text x="790" y="361" text-anchor="middle" class="small">ingress: internal-and-LB only</text>
  <line class="arrow" x1="790" y1="366" x2="790" y2="382"/>

  <rect class="box" x="660" y="382" width="260" height="30" rx="6"/>
  <text x="790" y="402" text-anchor="middle" class="label">Cloud Logging (automatic)</text>

  <rect class="box secret" x="660" y="424" width="260" height="30" rx="6"/>
  <text x="790" y="444" text-anchor="middle" class="label">Secret Manager → env.value_source</text>
  <line class="arrow" x1="790" y1="424" x2="790" y2="366"/>

  <!-- Bootstrap / OIDC footer -->
  <rect class="box ci" x="20" y="486" width="900" height="150" rx="8"/>
  <text x="470" y="512" text-anchor="middle" class="title">bootstrap/{azure,aws,gcp} — one-time, run by hand</text>
  <text x="35" y="538" class="label">Azure</text>
  <text x="35" y="556" class="small">App registration + federated identity</text>
  <text x="35" y="572" class="small">credential (subject = repo:org@id/repo@id:...)</text>
  <text x="35" y="588" class="small">→ Contributor role, no client secret</text>

  <text x="345" y="538" class="label">AWS</text>
  <text x="345" y="556" class="small">IAM OIDC provider (token.actions.</text>
  <text x="345" y="572" class="small">githubusercontent.com) + IAM role trust</text>
  <text x="345" y="588" class="small">policy scoped to the sub claim</text>

  <text x="655" y="538" class="label">GCP</text>
  <text x="655" y="556" class="small">Workload Identity Pool + Provider,</text>
  <text x="655" y="572" class="small">condition on the repository claim</text>
  <text x="655" y="588" class="small">(unaffected by the 2026 sub-claim change)</text>

  <text x="470" y="616" text-anchor="middle" class="small">Each cloud's Actions job exchanges its OIDC token for short-lived credentials at plan/apply time — nothing to rotate.</text>
</svg>
