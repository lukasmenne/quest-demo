name: image

on:
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "package*.json"
      - "Dockerfile"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "package*.json"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  build-and-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: quest:pr-${{ github.event.pull_request.number }}

      - name: Scan image (table, for the PR comment)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quest:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "0"
          output: trivy-report.txt

      - name: Scan image (SARIF, for the Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quest:pr-${{ github.event.pull_request.number }}
          format: sarif
          exit-code: "0"
          output: trivy-results.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Truncate report to fit GitHub's comment size limit
        run: |
          LIMIT=60000
          if [ "$(wc -c < trivy-report.txt)" -gt "$LIMIT" ]; then
            { head -c "$LIMIT" trivy-report.txt; printf '\n\n... truncated — see the full table in this run'\''s logs, or the SARIF results in the Security tab.\n'; } > trivy-comment.txt
          else
            cp trivy-report.txt trivy-comment.txt
          fi

      - name: Comment findings on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: trivy-scan
          path: trivy-comment.txt

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lukasmenne/quest-demo:sha-${{ steps.vars.outputs.sha_short }}
            ghcr.io/lukasmenne/quest-demo:latest
