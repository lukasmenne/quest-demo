name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "env/dev/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "env/dev/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: env/dev

env:
  # Client/subscription/tenant IDs and resource names below are identifiers, not credentials —
  # OIDC means there's no client secret to protect, so these are GitHub Actions *variables*
  # (vars), not secrets. Only actual credential material (SECRET_WORD, AWS keys, GCP service
  # account JSON) uses secrets.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  TF_VAR_client_id: ${{ vars.ARM_CLIENT_ID }}
  TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.ARM_TENANT_ID }}
  TF_VAR_secret_word: ${{ secrets.SECRET_WORD }}
  TF_VAR_image: ghcr.io/lukasmenne/quest-demo:latest

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      # Real AWS auth once bootstrap/aws has run and AWS_ROLE_ARN is set (see its output). A
      # no-op until then, matching the "enable_aws flips on, no code changes needed" design.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # GCP: mutually exclusive with the placeholder step below — real WIF creds once
      # bootstrap/gcp has run and GCP_WORKLOAD_IDENTITY_PROVIDER is set.
      - name: Configure GCP credentials (OIDC)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Use placeholder GCP credentials (until GCP OIDC is wired)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "GOOGLE_CREDENTIALS=${{ secrets.GOOGLE_CREDENTIALS }}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v4

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}" \
            -backend-config="key=quest.tfstate"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        # Without pipefail, this step's exit code is tee's (always 0), not terraform's --
        # a real plan error would print in plan.txt but still be reported as a passing check.
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan.binary | tee plan.txt
        continue-on-error: true

      - name: Build PR comment
        run: |
          SUMMARY=$(grep -E '^(Plan:|No changes)' plan.txt || echo "Plan produced no summary line - check the full output below.")
          {
            echo "### Terraform Plan"
            echo
            echo "**${SUMMARY}**"
            echo
            echo "<details><summary>Full plan output</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan
          path: env/dev/comment.md

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure GCP credentials (OIDC)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}" \
            -backend-config="key=quest.tfstate"

      - name: terraform apply
        run: terraform apply -auto-approve -input=false
