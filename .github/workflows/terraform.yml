name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "env/dev/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "env/dev/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: env/dev

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_VAR_client_id: ${{ secrets.ARM_CLIENT_ID }}
  TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.ARM_TENANT_ID }}
  TF_VAR_secret_word: ${{ secrets.SECRET_WORD }}
  TF_VAR_image: ghcr.io/lukasmenne/quest-demo:latest
  # Required even while enable_aws/enable_gcp are false — Terraform configures every declared
  # provider block regardless of whether count-gated resources use it. See docs/plan.md Phase 4.
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.AZURE_TFSTATE_CONTAINER }}" \
            -backend-config="key=quest.tfstate"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan.binary | tee plan.txt
        continue-on-error: true

      - name: Build PR comment
        run: |
          SUMMARY=$(grep -E '^(Plan:|No changes)' plan.txt || echo "Plan produced no summary line - check the full output below.")
          {
            echo "### Terraform Plan"
            echo
            echo "**${SUMMARY}**"
            echo
            echo "<details><summary>Full plan output</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          path: env/dev/comment.md

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.AZURE_TFSTATE_CONTAINER }}" \
            -backend-config="key=quest.tfstate"

      - name: terraform apply
        run: terraform apply -auto-approve -input=false
